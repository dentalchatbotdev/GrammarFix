name: Auto Promote

on:
  schedule:
    - cron: '0 12 * * *'  # Every day at noon
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping Google
        run: curl -s "https://www.google.com/ping?sitemap=https://grammarfix.pages.dev/sitemap.xml"

      - name: Health Check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://grammarfix.pages.dev/")
          if [ "$STATUS" != "200" ]; then exit 1; fi
          echo "Site OK ($STATUS)"

      - name: Post to Bluesky
        env:
          BLUESKY_USER: ${{ secrets.BLUESKY_USER }}
          BLUESKY_PASS: ${{ secrets.BLUESKY_PASS }}
        run: |
          POSTS=(
            "Free grammar checker. No signup, no tracking.\nhttps://grammarfix.pages.dev"
            "Your text stays yours. GrammarFix processes and forgets.\nhttps://grammarfix.pages.dev"
            "Grammar checker that respects your privacy. No account needed.\nhttps://grammarfix.pages.dev"
          )
          TEXT=${POSTS[$((RANDOM % 3))]}
          SESSION=$(curl -s -X POST https://bsky.social/xrpc/com.atproto.server.createSession \
            -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$BLUESKY_USER\",\"password\":\"$BLUESKY_PASS\"}")
          DID=$(echo "$SESSION" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).did))")
          TOKEN=$(echo "$SESSION" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).accessJwt))")
          curl -s -X POST https://bsky.social/xrpc/com.atproto.repo.createRecord \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "{\"repo\":\"$DID\",\"collection\":\"app.bsky.feed.post\",\"record\":{\"text\":\"$TEXT\",\"createdAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
          echo "Posted to Bluesky"

      - name: Post to Mastodon
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
        run: |
          POSTS=(
            "Free grammar checker. No signup, no tracking.\nhttps://grammarfix.pages.dev"
            "Your text stays yours. GrammarFix processes and forgets.\nhttps://grammarfix.pages.dev"
            "Grammar checker that respects your privacy. No account needed.\nhttps://grammarfix.pages.dev"
          )
          TEXT=${POSTS[$((RANDOM % 3))]}
          curl -s -X POST "$MASTODON_INSTANCE/api/v1/statuses" \
            -H "Authorization: Bearer $MASTODON_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$TEXT\"}"
          echo "Posted to Mastodon"
